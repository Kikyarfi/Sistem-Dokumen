<style>
  :root {
    --primary:#435ebe;
    --primary-dark:#263f8f;
    --navy:#17233c;
    --muted:#718096;
    --bg:#f5f7fb;
    --card:#ffffff;
    --border:#e5e9f2;
    --danger:#dc3545;
    --success:#198754;
    --sidebar-width:270px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--navy)}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  a{color:inherit}
  .hidden{display:none!important}
  .page{display:none}.page.active{display:block}
  .landing,.login-page,.public-shell{min-height:100vh}
  .landing{display:grid;place-items:center;padding:32px;background:linear-gradient(135deg,#0b1730,#183e67)}
  .landing-card{width:min(720px,100%);background:#fff;border-radius:28px;padding:40px;box-shadow:0 30px 80px rgba(0,0,0,.22);text-align:center}
  .brand-mark{width:72px;height:72px;border-radius:22px;background:var(--primary);color:#fff;margin:0 auto 18px;display:grid;place-items:center;font-weight:800;font-size:24px}
  .landing h1{font-size:38px;margin:0 0 10px}.landing p{color:var(--muted);line-height:1.65}
  .landing-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}
  .btn-primary,.btn-secondary,.login-button,.public-submit-btn,.upload-submit{border:0;border-radius:12px;padding:12px 18px;font-weight:700}
  .btn-primary,.login-button,.public-submit-btn,.upload-submit{background:var(--primary);color:#fff}.btn-secondary{background:#eef2ff;color:var(--primary)}
  .login-page{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(400px,.9fr)}
  .login-brand-panel{padding:56px 64px;background:linear-gradient(135deg,#0b1730,#0b4164);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
  .login-brand-top{display:flex;align-items:center;gap:14px}.login-demo-logo{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:900}
  .login-brand-title{font-size:56px;line-height:.95;margin:18px 0}.login-brand-subtitle{max-width:590px;color:rgba(255,255,255,.78);line-height:1.65}
  .login-brand-pill{display:inline-flex;margin-top:14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 12px;font-size:12px}
  .login-form-panel{display:grid;place-items:center;padding:40px;background:#f4f6fb}.login-card{width:min(440px,100%);background:#fff;padding:34px;border-radius:24px;box-shadow:0 18px 55px rgba(31,45,72,.12)}
  .login-card h1{margin:0 0 8px}.login-card p{color:var(--muted)}.form-group{margin-top:18px}.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.form-group input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:11px;outline:0}.form-group input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(67,94,190,.1)}
  .login-button{width:100%;margin-top:22px}.login-links{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:12px}.link-button{border:0;background:none;color:var(--primary);padding:0}.login-message{margin-top:14px;font-size:13px}
  #mainApp{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-width);background:#17233c;color:#fff;padding:24px 18px;display:flex;flex-direction:column;z-index:10}.sidebar-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}.sidebar-brand .brand-mark{width:44px;height:44px;border-radius:13px;margin:0;font-size:16px}.sidebar-brand strong{display:block}.sidebar-brand small{color:#9aa5bd}
  .sidebar-menu{display:grid;gap:7px}.sidebar-menu button{border:0;background:transparent;color:#b8c0d2;border-radius:11px;padding:11px 12px;text-align:left;display:flex;align-items:center;gap:10px}.sidebar-menu button:hover,.sidebar-menu button.active{background:rgba(255,255,255,.1);color:#fff}
  .sidebar-user{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:16px 8px 0}.sidebar-user-name{font-weight:700}.sidebar-user-email{font-size:11px;color:#9aa5bd;margin-top:3px;word-break:break-all}.sidebar-author{margin-top:12px;padding:10px 11px;border-radius:12px;background:rgba(255,255,255,.07);font-size:11px;color:#c9d0df}.sidebar-author a{display:flex;align-items:center;gap:7px;text-decoration:none;color:#fff;font-weight:700}.role-badge{display:inline-flex;margin-top:10px;border-radius:999px;background:rgba(67,94,190,.35);padding:5px 9px;font-size:10px;font-weight:800}.logout-button{margin-top:10px;width:100%;border:1px solid rgba(255,255,255,.14);background:transparent;color:#fff;border-radius:10px;padding:9px}
  .main{margin-left:var(--sidebar-width);min-height:100vh;padding:30px;overflow:auto}.app-footer{margin:34px 0 4px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px}.app-footer a{color:var(--primary);font-weight:700;text-decoration:none}
  .card,.upload-card,.history-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(31,45,72,.06)}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.page-title h1,.card h1{margin:0}.page-subtitle{color:var(--muted);font-size:13px;margin-top:5px}
  .toolbar,.history-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.history-toolbar input,.history-toolbar select,.upload-field input,.upload-field select,.upload-field textarea,.public-field input,.public-field select,.public-field textarea{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;color:var(--navy)}.toolbar input,.history-toolbar input{min-width:240px;flex:1}
  .bank-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.bank-summary-actions{display:flex;gap:8px}.bank-view-btn,.btn-reset,.upload-clear,.public-reset-btn{border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:9px;padding:8px 11px}.bank-view-btn.active{background:#eef2ff;color:var(--primary);border-color:#cfd6ff}

  .upload-grid,.public-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.upload-field,.public-field{display:grid;gap:7px}.upload-field.full,.public-field.full{grid-column:1/-1}.upload-field label,.public-field label{font-size:12px;font-weight:750}.upload-field textarea,.public-field textarea{min-height:100px;resize:vertical}.upload-note,.public-field small{color:var(--muted);font-size:11px}.upload-actions,.public-upload-actions{display:flex;gap:10px;margin-top:18px}.upload-message,.public-upload-message{margin-top:12px;font-size:12px}
  .public-shell{background:#f5f7fb}.public-topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 26px;background:#fff;border-bottom:1px solid var(--border)}.public-brand{display:flex;align-items:center;gap:12px}.public-brand-logo{width:46px;height:46px}.public-brand-ministry{font-weight:800}.public-brand-unit{font-size:11px;color:var(--muted)}.public-back-btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 12px}.public-upload-main{padding:30px;display:grid;place-items:start center}.public-upload-card{width:min(820px,100%);background:#fff;border-radius:22px;padding:26px;border:1px solid var(--border)}.public-upload-header{display:flex;gap:14px}.public-upload-icon{width:54px;height:54px;border-radius:15px;background:#eef2ff;color:var(--primary);display:grid;place-items:center;font-size:22px}.public-upload-header h1{margin:0}.public-upload-header p{margin:6px 0;color:var(--muted)}.public-form-section-title{font-size:13px;font-weight:850;margin:24px 0 10px}.public-footer{text-align:center;color:var(--muted);font-size:11px;padding:18px}
  .custom-modal-overlay,.pdf-preview-modal{display:none;position:fixed;inset:0;background:rgba(12,18,32,.58);z-index:100;align-items:center;justify-content:center;padding:20px}.custom-modal-overlay.open,.pdf-preview-modal.open{display:flex}.detail-modal-card,.custom-modal-card,.pdf-preview-dialog{width:min(820px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}.detail-modal-header,.pdf-preview-header{display:flex;justify-content:space-between;gap:12px;align-items:center}.detail-close-btn,.pdf-preview-close{border:0;background:#f1f3f8;border-radius:9px;padding:8px}.detail-grid,.detail-edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.detail-item,.detail-edit-field{border:1px solid var(--border);border-radius:12px;padding:11px}.detail-item.full,.detail-edit-field.full{grid-column:1/-1}.detail-label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}.detail-value{margin-top:5px}.detail-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.detail-action-btn,.custom-modal-btn{border:0;border-radius:9px;padding:9px 12px}.detail-action-btn.download,.custom-modal-btn.primary{background:var(--primary);color:#fff}.detail-action-btn.delete,.custom-modal-btn.danger{background:#fff0f1;color:var(--danger)}.detail-action-btn.edit,.custom-modal-btn.secondary{background:#f1f3f8;color:var(--navy)}.detail-edit-form{display:none}.detail-edit-form.active{display:block}.pdf-preview-dialog{width:min(1000px,96vw)}.pdf-preview-pages canvas{display:block;margin:14px auto;max-width:100%;box-shadow:0 4px 18px rgba(0,0,0,.1)}
  body.dark-mode{--bg:#161622;--card:#252536;--navy:#edf0f8;--muted:#a5abba;--border:#37374a;background:#161622;color:#edf0f8}.dark-mode .main,.dark-mode .public-shell{background:#161622}.dark-mode .card,.dark-mode .upload-card,.dark-mode .history-card,.dark-mode .public-upload-card,.dark-mode .public-topbar,.dark-mode .detail-modal-card,.dark-mode .custom-modal-card,.dark-mode .pdf-preview-dialog{background:#252536;color:#edf0f8}.dark-mode input,.dark-mode select,.dark-mode textarea,.dark-mode .btn-reset,.dark-mode .bank-view-btn{background:#1e1e2d!important;color:#edf0f8!important;border-color:#37374a!important}
  @media(max-width:860px){.login-page{grid-template-columns:1fr}.login-brand-panel{display:none}.sidebar{position:static;width:auto}.main{margin-left:0}.upload-grid,.public-form-grid,.detail-grid,.detail-edit-grid{grid-template-columns:1fr}.upload-field.full,.public-field.full,.detail-item.full,.detail-edit-field.full{grid-column:auto}.app-footer{flex-direction:column}}
</style>
